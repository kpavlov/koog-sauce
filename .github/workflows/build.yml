name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      runner:
        description: "Choose the runner to use"
        default: "ubuntu-latest"
        type: choice
        options:
          - ubuntu-latest
          - macos-latest

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner  || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      matrix:
        java-version:
          - 17
          # - 21
          # - 24
      fail-fast: false

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 9.0.0

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      if: runner.os == 'macOS'
      with:
        xcode-version: latest-stable

    - name: Build with Gradle
      run: gradle build test koverXmlReport --no-daemon

    - name: Upload test results
      if: success() || failure() # always run even if the previous step fails
      uses: actions/upload-artifact@v5
      with:
        name: test-results-jdk-${{ matrix.java-version }}
        path: |
          **/build/reports/tests/
          **/build/test-results/

    - name: Upload coverage reports
      uses: actions/upload-artifact@v5
      with:
        name: coverage-reports-jdk-${{ matrix.java-version }}
        path: |
          **/build/reports/kover/

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-jdk-${{ matrix.java-version }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-jdk-${{ matrix.java-version }}-
